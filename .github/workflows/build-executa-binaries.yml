# =============================================================================
# Career Forge — Executa multi-platform binary build  (SELF-CONTAINED)
# =============================================================================
# Builds the bundled Python Executa (`career-engine`) into one-file binaries for
# the 4 platforms the Anna Agent installs from:
#
#   darwin-arm64    -> macOS Apple Silicon  (tar.gz)
#   darwin-x86_64   -> macOS Intel          (tar.gz)
#   linux-x86_64    -> Linux x86_64         (tar.gz)  <-- REQUIRED. This is the
#                                                        binary the Anna Cloud
#                                                        Agent runs. Built inside
#                                                        manylinux_2_28 so it only
#                                                        needs glibc >= 2.28.
#   windows-x86_64  -> Windows x86_64       (zip)
#
# Trigger: Actions -> "Build Career Engine Executa Binaries" -> Run workflow
#          (version must match executas/career-engine-python/executa.json)
#
# Output: GitHub Release `career-engine-v<version>` with 4 archives + .sha256
#
# Then locally:
#   powershell -ExecutionPolicy Bypass -File .\scripts\download-binaries.ps1 -Version 1.0.1 -Repo RANJITHROSAN17/career-forge
#   anna-app apps publish
# =============================================================================

name: Build Career Engine Executa Binaries

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Executa version (must match executas/career-engine-python/executa.json)"
        required: true
        default: "1.0.1"

permissions:
  contents: write

env:
  EXECUTA_NAME: career-engine
  EXECUTA_DIR: executas/career-engine-python

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon (macos-15 = current Apple Silicon image)
          - os: macos-15
            platform: darwin-arm64
          # macOS Intel. NOTE: macos-13 is RETIRED - a retired label does not
          # fail, it just queues forever. macos-15-intel is the supported
          # Intel label (available until Aug 2027).
          - os: macos-15-intel
            platform: darwin-x86_64
          # Linux x86_64 - built inside manylinux_2_28 for glibc compatibility.
          - os: ubuntu-latest
            platform: linux-x86_64
          # Windows x86_64
          - os: windows-latest
            platform: windows-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        if: matrix.os != 'ubuntu-latest'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ===================================================================
      # macOS + Windows
      # Runs in bash on BOTH. Windows git-bash is deliberate: in PowerShell,
      # any native-command stderr (this plugin prints a startup banner to
      # stderr) becomes a terminating error under $ErrorActionPreference
      # = 'Stop' and kills the step.
      # ===================================================================
      - name: Build + smoke-test + package (macOS / Windows)
        if: runner.os != 'Linux'
        shell: bash
        env:
          NAME: career-engine
          VERSION: ${{ inputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          cd "${{ env.EXECUTA_DIR }}"
          python -m pip install --upgrade pip "pyinstaller>=6.10,<7"
          python -m PyInstaller --onefile --name "$NAME" --clean --noconfirm \
            --log-level WARN career_engine_plugin.py

          BIN="./dist/$NAME"
          if [[ "$PLATFORM" == windows-* ]]; then BIN="./dist/$NAME.exe"; fi

          mkdir -p .build-tmp
          echo "== smoke test: JSON-RPC describe over stdio ($BIN)"
          set +e
          printf '{"jsonrpc":"2.0","id":1,"method":"describe"}\n' | "$BIN" \
            > .build-tmp/describe.json 2> .build-tmp/describe.err
          code=$?
          set -e
          echo "--- exit: $code"
          echo "--- stdout:"; cat .build-tmp/describe.json
          echo "--- stderr:"; cat .build-tmp/describe.err

          # Relative path on purpose: Windows python cannot resolve "/tmp".
          python -c "import json,pathlib;raw=pathlib.Path('.build-tmp/describe.json').read_text(encoding='utf-8',errors='replace').strip();assert raw,'binary produced no stdout';d=json.loads(raw);assert 'result' in d,d;print('describe smoke test OK')"

          cd dist
          if [[ "$PLATFORM" == windows-* ]]; then
            python -m zipfile -c "$NAME-$VERSION-$PLATFORM.zip" "$NAME.exe"
            ART="$NAME-$VERSION-$PLATFORM.zip"
          else
            tar czf "$NAME-$VERSION-$PLATFORM.tar.gz" "$NAME"
            ART="$NAME-$VERSION-$PLATFORM.tar.gz"
          fi
          python -c "import hashlib,pathlib,sys;p=pathlib.Path(sys.argv[1]);p.with_name(p.name+'.sha256').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+chr(10),encoding='utf-8');print('sha256 written for',p.name)" "$ART"
          ls -la

      # ===================================================================
      # Linux x86_64 - manylinux_2_28 container
      # The build script is written with a quoted heredoc (no shell expansion)
      # to $RUNNER_TEMP and then mounted into the container, which keeps it
      # free of YAML/nested-quoting problems.
      # ===================================================================
      - name: Build + smoke-test + package (linux-x86_64, manylinux_2_28)
        if: runner.os == 'Linux'
        shell: bash
        env:
          NAME: career-engine
          VERSION: ${{ inputs.version }}
          PLATFORM: linux-x86_64
          IMAGE: quay.io/pypa/manylinux_2_28_x86_64
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/build-executa.sh" <<'SCRIPT_EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          echo "== platform: $PLATFORM   version: $VERSION"
          PY="$(ls -d /opt/python/cp3*/bin/python 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$PY" ] || [ ! -x "$PY" ]; then PY=python3; fi
          echo "== python: $PY ($("$PY" -V 2>&1))"

          cd /io/executas/career-engine-python
          "$PY" -m pip install --upgrade pip "pyinstaller>=6.10,<7"
          "$PY" -m PyInstaller --onefile --name "$NAME" --clean --noconfirm \
            --log-level WARN career_engine_plugin.py

          echo "== smoke test: JSON-RPC describe over stdio"
          mkdir -p .build-tmp
          set +e
          printf '{"jsonrpc":"2.0","id":1,"method":"describe"}\n' | "./dist/$NAME" \
            > .build-tmp/describe.json 2> .build-tmp/describe.err
          code=$?
          set -e
          echo "--- exit: $code"
          echo "--- stdout:"; cat .build-tmp/describe.json
          echo "--- stderr:"; cat .build-tmp/describe.err
          "$PY" -c "import json,pathlib;raw=pathlib.Path('.build-tmp/describe.json').read_text(encoding='utf-8',errors='replace').strip();assert raw,'binary produced no stdout';d=json.loads(raw);assert 'result' in d,d;print('describe smoke test OK')"

          cd dist
          tar czf "$NAME-$VERSION-$PLATFORM.tar.gz" "$NAME"
          "$PY" -c "import hashlib,pathlib,sys;p=pathlib.Path(sys.argv[1]);p.with_name(p.name+'.sha256').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+chr(10),encoding='utf-8');print('sha256 written for',p.name)" "$NAME-$VERSION-$PLATFORM.tar.gz"
          ls -la
          SCRIPT_EOF

          echo "== docker:"
          docker version || true
          echo "== pulling $IMAGE"
          docker pull "$IMAGE"

          # --entrypoint /bin/bash is explicit: if the image ever declares an
          # ENTRYPOINT, our command would otherwise be swallowed by it.
          docker run --rm \
            --entrypoint /bin/bash \
            -e NAME -e VERSION -e PLATFORM \
            -v "$GITHUB_WORKSPACE:/io" \
            -v "$RUNNER_TEMP:/scripts" \
            -w /io \
            "$IMAGE" \
            /scripts/build-executa.sh

          # Files created inside the container are root-owned; make them
          # readable so actions/upload-artifact (runner user) can read them.
          sudo chmod -R a+rX "$GITHUB_WORKSPACE/${{ env.EXECUTA_DIR }}" 2>/dev/null || true
          ls -la "$GITHUB_WORKSPACE/${{ env.EXECUTA_DIR }}/dist"

      # -------------------------------------------------------------- artifact
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: career-engine-${{ matrix.platform }}
          path: ${{ env.EXECUTA_DIR }}/dist/career-engine-${{ inputs.version }}-${{ matrix.platform }}.*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: career-engine-*
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist

      - name: Create GitHub Release (career-engine-v${{ inputs.version }})
        uses: softprops/action-gh-release@v2
        with:
          tag_name: career-engine-v${{ inputs.version }}
          name: career-engine v${{ inputs.version }}
          generate_release_notes: true
          files: dist/career-engine-${{ inputs.version }}-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
